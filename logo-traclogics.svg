<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="TRACLOGICS">
<!-- TRACLOGICS - le tour de piste.
     Meme systeme que DRAGLOGICS : meme cadre, meme asphalte, meme rouge
     #c22428, meme blanc de marquage.

     ⚠ CE QUI DIT « CIRCUIT », C'EST LE TROU AU MILIEU. Un premier dessin
     serpentait davantage, plus fidele a un vrai trace ; a 44 px dans le
     bouton il se lisait comme un chiffre 2. La boucle doit donc etre LARGE,
     FERMEE et PERCEE : c'est la silhouette qui distingue les deux metiers,
     un circuit qu'on repasse contre un aller simple. La fidelite a un trace
     reel ne vaut rien si la marque n'est pas reconnue. -->
<rect x="0" y="0" width="120" height="120" rx="22" fill="#15161a"/>

<!-- Le ruban : une boucle franche, avec une seule inflexion a gauche pour
     qu'elle ne soit pas un simple ovale. Le trait est epais, le trou reste
     grand. -->
<path id="piste"
      d="M 60,24
         C 82,24 98,36 98,58
         C 98,80 82,96 60,96
         C 44,96 34,88 30,78
         C 27,70 33,64 40,64
         C 47,64 52,58 48,51
         C 44,44 30,44 27,36
         C 24,29 38,24 60,24 Z"
      fill="none" stroke="#33353c" stroke-width="17" stroke-linejoin="round"/>
<path d="M 60,24
         C 82,24 98,36 98,58
         C 98,80 82,96 60,96
         C 44,96 34,88 30,78
         C 27,70 33,64 40,64
         C 47,64 52,58 48,51
         C 44,44 30,44 27,36
         C 24,29 38,24 60,24 Z"
      fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="6 8" opacity="0.5"/>

<!-- La ligne de depart-arrivee, en travers du ruban, en haut a droite du
     trace. C'est elle que la voiture franchit et qui ferme le tour. -->
<g transform="translate(72,24.6) rotate(6)">
  <rect x="-3" y="-10" width="6" height="20" fill="#ffffff"/>
  <rect x="-3" y="-10" width="6" height="6.6" fill="#c22428"/>
  <rect x="-3" y="3.4"  width="6" height="6.6" fill="#c22428"/>
</g>

<!-- Le relais, pose au bord de la ligne, avec son onde.
     Il est present ici et absent de DRAGLOGICS, ou aucun beacon n'est ecoute. -->
<circle cx="72" cy="44" r="5" fill="#c22428"/>
<path d="M 64,44 a 8,8 0 0 1 16,0" fill="none" stroke="#c22428" stroke-width="2" opacity="0.6"/>
</svg>
