<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="DRAGLOGICS">
<!-- DRAGLOGICS - la ligne droite.
     Palette reprise du logo existant : rouge #c22428, asphalte #15161a, blanc.
     ⚠ DESSIN VOLONTAIREMENT GROSSIER. Cette marque est lue a 44 px dans un
     bouton. Un detail fin y disparait, et deux marques qui se ressemblent de
     loin ne servent a rien : c'est la SILHOUETTE qui doit trancher. Ici deux
     bandes qui filent tout droit ; sur TRACLOGICS, une boucle fermee. -->
<rect x="0" y="0" width="120" height="120" rx="22" fill="#15161a"/>

<!-- Les deux voies, qui montent tout droit -->
<rect x="26" y="16" width="26" height="88" fill="#232429"/>
<rect x="68" y="16" width="26" height="88" fill="#232429"/>

<!-- Le marquage central, en pointille -->
<g fill="#ffffff" opacity="0.85">
  <rect x="57" y="20" width="6" height="12"/>
  <rect x="57" y="40" width="6" height="12"/>
  <rect x="57" y="60" width="6" height="12"/>
  <rect x="57" y="80" width="6" height="12"/>
</g>

<!-- La ligne de depart, en bas -->
<rect x="26" y="98" width="68" height="6" fill="#ffffff"/>

<!-- L'arbre de depart : trois feux, le dernier vert.
     C'est le signe qui dit "depart arrete", propre a la ligne droite. -->
<g>
  <circle cx="14" cy="40" r="6" fill="#c22428"/>
  <circle cx="14" cy="58" r="6" fill="#c22428"/>
  <circle cx="14" cy="76" r="6" fill="#3ddc84"/>
</g>

<!-- L'arrivee, damier reduit a quatre cases -->
<g>
  <rect x="26" y="16" width="17" height="8" fill="#ffffff"/>
  <rect x="43" y="16" width="17" height="8" fill="#c22428"/>
  <rect x="60" y="16" width="17" height="8" fill="#ffffff"/>
  <rect x="77" y="16" width="17" height="8" fill="#c22428"/>
</g>
</svg>
